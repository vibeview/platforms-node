name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The npm bundled with Node 20 and 22 fails on this package's dependency tree.
      - run: npm install -g npm@11.21.3
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
